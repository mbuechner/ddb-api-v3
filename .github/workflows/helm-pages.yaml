name: Helm repository

on:
  # A successful matrix build guarantees that both commit-addressed images were
  # pushed before a chart can refer to them.
  workflow_run:
    workflows:
      - Container images
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm repository
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify referenced container images
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${COMMIT_SHA::7}"
          docker buildx imagetools inspect "ghcr.io/$owner/ddb-api-v3-service:$image_tag"
          docker buildx imagetools inspect "ghcr.io/$owner/ddb-api-v3-gateway:$image_tag"

      - name: Prepare published chart
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${COMMIT_SHA::7}"
          chart_dir="$RUNNER_TEMP/ddb-api-v3"

          cp -R charts/ddb-api-v3 "$chart_dir"

          test "$(grep -c 'repository: ghcr.io/mbuechner/ddb-api-v3-service' "$chart_dir/values.yaml")" -eq 1
          test "$(grep -c 'repository: ghcr.io/mbuechner/ddb-api-v3-gateway' "$chart_dir/values.yaml")" -eq 1
          test "$(grep -c 'tag: "latest"' "$chart_dir/values.yaml")" -eq 2

          sed -i "s|repository: ghcr.io/mbuechner/ddb-api-v3-service|repository: ghcr.io/$owner/ddb-api-v3-service|" "$chart_dir/values.yaml"
          sed -i "s|repository: ghcr.io/mbuechner/ddb-api-v3-gateway|repository: ghcr.io/$owner/ddb-api-v3-gateway|" "$chart_dir/values.yaml"
          sed -i "s|tag: \"latest\"|tag: \"$image_tag\"|g" "$chart_dir/values.yaml"

          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          # Resolve the version pinned in Chart.lock from the repository named
          # in Chart.yaml. Dependency archives are not stored in this repo.
          helm dependency build "$chart_dir"
          helm dependency list "$chart_dir"
          helm lint "$chart_dir" \
            --set-string cassandra.username=lint,cassandra.password=lint

          mkdir -p _site
          helm package "$chart_dir" --destination _site --app-version "$image_tag"
          helm repo index _site --url "${{ steps.pages.outputs.base_url }}"

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><meta charset="utf-8"><title>DDB API v3 Helm Repository</title>' \
            '<h1>DDB API v3 Helm Repository</h1>' \
            '<p>Add this URL with <code>helm repo add ddb-api-v3 &lt;URL&gt;</code>.</p>' \
            '<p>The repository index is available at <a href="index.yaml">index.yaml</a>.</p>' \
            '</html>' > _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
