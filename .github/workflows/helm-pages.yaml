name: Helm repository

on:
  # Publish after the image workflow succeeds. Charts keep tracking rolling
  # through OpenShift's scheduled ImageStream imports.
  workflow_run:
    workflows:
      - Container images
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm repository
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        (github.event.workflow_run.event == 'workflow_dispatch' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify built container images
        id: images
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          verify_promotion=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$BUILD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
            if [[ "$COMMIT_SHA" != "$head_sha" ]]; then
              echo "Skipping chart publication for superseded commit $COMMIT_SHA"
              exit 0
            fi
            verify_promotion=true
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${COMMIT_SHA::7}"
          matches_build=true
          matches_commit=true
          for package in ddb-api-v3-service ddb-api-v3-gateway; do
            image="ghcr.io/$owner/$package"
            commit_digest="$(docker buildx imagetools inspect --format '{{printf "%s" .Manifest.Digest}}' "$image:$image_tag")"
            rolling_digest="$(docker buildx imagetools inspect --format '{{printf "%s" .Manifest.Digest}}' "$image:rolling")"
            if [[ "$verify_promotion" == true ]]; then
              build_digest="$(docker buildx imagetools inspect --format '{{printf "%s" .Manifest.Digest}}' "$image:build-$BUILD_RUN_ID")"
              [[ "$rolling_digest" == "$build_digest" ]] || matches_build=false
              [[ "$rolling_digest" == "$commit_digest" ]] || matches_commit=false
            fi
          done
          # Accept a complete same-commit rebuild, even if it did not trigger Pages.
          if [[ "$matches_build" == false && "$matches_commit" == false ]]; then
            echo "Skipping chart publication because the rolling images match neither the triggering build nor the current commit"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install ACL smoke-test dependency
        if: steps.images.outputs.publish == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/acl-smoke"
          "$RUNNER_TEMP/acl-smoke/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Prepare published chart
        if: steps.images.outputs.publish == 'true'
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="sha-${COMMIT_SHA::7}"
          chart_dir="$RUNNER_TEMP/ddb-api-v3"

          cp -R charts/ddb-api-v3 "$chart_dir"

          test "$(grep -c 'repository: ghcr.io/mbuechner/ddb-api-v3-service' "$chart_dir/values.yaml")" -eq 1
          test "$(grep -c 'repository: ghcr.io/mbuechner/ddb-api-v3-gateway' "$chart_dir/values.yaml")" -eq 1

          sed -i "s|repository: ghcr.io/mbuechner/ddb-api-v3-service|repository: ghcr.io/$owner/ddb-api-v3-service|" "$chart_dir/values.yaml"
          sed -i "s|repository: ghcr.io/mbuechner/ddb-api-v3-gateway|repository: ghcr.io/$owner/ddb-api-v3-gateway|" "$chart_dir/values.yaml"
          # The chart resource check below verifies the published rolling defaults.
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          # Resolve the version pinned in Chart.lock from its upstream repository.
          # Only generated dependency archives are packaged; no chart fork is maintained.
          helm dependency build "$chart_dir"
          helm dependency list "$chart_dir"
          # helm lint has no API-capabilities flag. Lint its portable fallback,
          # then compile the actual defaults with both custom APIs below.
          portable="global.openshift.imageStreams.enabled=false,apiService.vpa.enabled=false,gateway.vpa.enabled=false,redis.vpa.enabled=false"
          helm lint "$chart_dir" --strict --set "$portable"
          helm lint "$chart_dir" --strict --values "$chart_dir/values-production.yaml" --set "$portable"
          "$RUNNER_TEMP/acl-smoke/bin/python" .github/scripts/check-chart-resources.py "$chart_dir"
          "$RUNNER_TEMP/acl-smoke/bin/python" .github/scripts/check-redis-acl.py "$chart_dir"

          # Stable SemVer: major.minor.(run * 1000 + attempt), no --devel needed.
          chart_version="$(helm show chart "$chart_dir" | awk '/^version:/ {print $2; exit}')"
          [[ "$chart_version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || {
            echo "Chart version must be a stable major.minor.patch version" >&2
            exit 1
          }
          chart_line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]{0,8}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]] || {
            echo "Expected run number 1..999999999 and attempt 1..999" >&2
            exit 1
          }
          package_version="${chart_line}.$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
          mkdir -p _site
          PAGES_BASE_URL="${PAGES_BASE_URL%/}"
          index_status="$(curl --silent --show-error --location --retry 2 \
            --connect-timeout 5 --max-time 15 --retry-max-time 45 \
            --output /dev/null --write-out '%{http_code}' "$PAGES_BASE_URL/index.yaml")"
          case "$index_status" in
            200)
              helm repo add ddb-published "$PAGES_BASE_URL" --force-update
              helm search repo ddb-published/ddb-api-v3 --versions --devel --output json \
                | jq -r '.[] | select(.name == "ddb-published/ddb-api-v3") | .version' \
                | while IFS= read -r version; do
                    helm pull ddb-published/ddb-api-v3 --version "$version" --destination _site
                  done
              ;;
            404) ;; # First publication has no index yet.
            *) printf 'Cannot read the published Helm index: HTTP %s\n' "$index_status" >&2; exit 1 ;;
          esac
          helm package "$chart_dir" --destination _site \
            --version "$package_version" --app-version "$image_tag"
          helm lint "_site/ddb-api-v3-$package_version.tgz" --strict --set "$portable,redis.haMode.enabled=false"
          helm lint "_site/ddb-api-v3-$package_version.tgz" --strict \
            --values "$chart_dir/values-production.yaml" --set "$portable,redis.haMode.enabled=true"
          # Verify actual coverage, explicit mode overlays and failure cases
          # against the packaged chart as well as the source directory above.
          "$RUNNER_TEMP/acl-smoke/bin/python" .github/scripts/check-chart-resources.py \
            "_site/ddb-api-v3-$package_version.tgz" --values-dir "$chart_dir"
          helm repo index _site --url "$PAGES_BASE_URL"

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="en"><meta charset="utf-8"><title>DDB API v3 Helm Repository</title>' \
            '<h1>DDB API v3 Helm Repository</h1>' \
            '<p>Add this URL with <code>helm repo add ddb-api-v3 &lt;URL&gt;</code>.</p>' \
            '<p>The repository index is available at <a href="index.yaml">index.yaml</a>.</p>' \
            '</html>' > _site/index.html

      - name: Upload GitHub Pages artifact
        if: steps.images.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: steps.images.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1
