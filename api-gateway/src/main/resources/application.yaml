server:
  port: ${GATEWAY_PORT:8081}
  shutdown: graceful
  # Only explicitly trusted deployments should let forwarded headers establish client/origin data.
  forward-headers-strategy: ${GATEWAY_FORWARD_HEADERS_STRATEGY:none}

spring:
  main:
    banner-mode: off
  config:
    # Load the shared local .env when the gateway runs from Maven or the IDE. Values already
    # present in the process environment take precedence; deployed containers need no file.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ddb-api-v3-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:}
          audiences: ${OAUTH2_AUDIENCE:}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
  profiles:
    active: ${APP_PROFILE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          # Stream request bodies, but bound sockets and waits for the backend.
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
            pool:
              type: fixed
              # Fixed-pool gauges expose saturation/waiters without request-ID or URI label cardinality.
              metrics: ${GATEWAY_PERFORMANCE_LOG_ENABLED:true}
              max-connections: ${GATEWAY_HTTP_MAX_CONNECTIONS:256}
              acquire-timeout: 1000
              max-idle-time: 30s
              # Reopen connections regularly so new backend replicas receive traffic.
              max-life-time: 60s
          metrics:
            enabled: true
          routes:
            # Shared RDF route; retain its ID because distributed quota keys include it.
            - id: records
              uri: ${GATEWAY_API_SERVICE_URI:http://127.0.0.1:${DDB_API_PORT:8080}}
              predicates:
                - Path=/3/**
              filters:
                # Keep the public origin available to an explicitly enabled API auto-base mode.
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@observedBucket4jRateLimiter}"
                    key-resolver: "#{@clientIdKeyResolver}"
                    bucket4j-rate-limiter.capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}
                    bucket4j-rate-limiter.refillTokens: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
                    bucket4j-rate-limiter.refillPeriod: ${GATEWAY_RATE_LIMIT_REFILL_PERIOD:1s}
                    bucket4j-rate-limiter.requestedTokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
                    bucket4j-rate-limiter.headerName: X-RateLimit-Remaining
                # Bucket4j emits the balance; these filters add the fixed bucket settings.
                - name: SetResponseHeader
                  args:
                    name: X-RateLimit-Replenish-Rate
                    value: "${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}"
                - name: SetResponseHeader
                  args:
                    name: X-RateLimit-Burst-Capacity
                    value: "${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}"
                - name: SetResponseHeader
                  args:
                    name: X-RateLimit-Requested-Tokens
                    value: "${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}"
            # Versionless RDF resource URLs only redirect; the /3 target keeps its auth/rate policy.
            - id: resource-redirects
              uri: ${GATEWAY_API_SERVICE_URI:http://127.0.0.1:${DDB_API_PORT:8080}}
              predicates:
                - Path=/{resource:(?!(?:actuator|openapi|webjars|swagger-ui|error|contexts)$)[a-z][a-z0-9-]*}/**
            - id: documentation
              uri: ${GATEWAY_API_SERVICE_URI:http://127.0.0.1:${DDB_API_PORT:8080}}
              predicates:
                - Path=/,/openapi/**,/swagger-ui.html,/webjars/**
          # Global framework CORS handling also answers OPTIONS requests that do not
          # match a route predicate. Credentials stay disabled because wildcard
          # origins and credentialed browser requests are mutually exclusive.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers:
                  # Browsers need the write ETag for the next If-Match request.
                  - ETag
                  - X-Record-ETag
                  - X-Item-ETag
                  - Location
                  - X-Request-Id
                  - X-RateLimit-Remaining
                  - X-RateLimit-Replenish-Rate
                  - X-RateLimit-Burst-Capacity
                  - X-RateLimit-Requested-Tokens
                  - Retry-After
                allow-credentials: false
                max-age: 3600

ddb:
  security:
    dev-write-token: ${DDB_DEV_WRITE_TOKEN:}
  logging:
    access:
      enabled: ${GATEWAY_ACCESS_LOG_ENABLED:true}
    performance:
      enabled: ${GATEWAY_PERFORMANCE_LOG_ENABLED:true}
      slow-threshold: ${GATEWAY_SLOW_REQUEST_THRESHOLD:100ms}
  gateway:
    client-id:
      allow-header: ${GATEWAY_CLIENT_ID_HEADER_ENABLED:true}
      header-name: ${GATEWAY_CLIENT_ID_HEADER_NAME:X-Client-Id}
      # Anonymous traffic is isolated from authenticated client buckets. Only the socket peer
      # is used; forwarded headers require a separately configured trusted-proxy strategy.
      allow-remote-address: ${GATEWAY_ANONYMOUS_RATE_LIMIT_BY_REMOTE_ADDRESS:true}

# One JSON object per event; Boot handles encoding, timestamps and service metadata.
logging:
  level:
    de.ddb.apiv3.access: ${GATEWAY_ACCESS_LOG_LEVEL:INFO}
    de.ddb.apiv3.performance: INFO
  structured:
    format:
      console: ${GATEWAY_LOG_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
