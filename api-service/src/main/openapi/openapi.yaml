openapi: 3.1.0
info:
  title: DDB API v3 - Records
  version: 3.0.0-dev
  contact:
    name: Michael Büchner
    email: m.buechner@dnb.de
    url: https://github.com/mbuechner/ddb-api-v3
  description: >-
    Standalone development contract containing only the Records API. It preserves
    record creation, replacement, deletion, validation, representation discovery,
    source and display access, and small batches. RDF record input is RDF/XML only;
    RDF output is negotiated through HTTP Accept across all production RDF formats
    registered by Apache Jena RIOT. Large bodies are streamed. Request bodies and
    response representations support gzip content coding.
servers:
  # Resolve API calls against the origin serving this contract. Swagger UI therefore works
  # unchanged on localhost, behind the gateway, and in every deployment environment.
  - url: /

security:
  - oauth2: [records:read]

tags:
  - name: Records
    description: Record metadata, representations, validation, and small batches.

paths:
  /3/records:
    post:
      tags: [Records]
      operationId: createRecord
      summary: Create a record
      description: >-
        Parses the complete RDF/XML record with Apache Jena RIOT and stores it only
        when it is valid RDF. The client supplies the globally unique record ID;
        the API never derives or replaces it. An existing ID returns 409.
        A 202 response links to the write-operation monitor.
      security:
        - oauth2: [records:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        $ref: '#/components/requestBodies/RecordWriteRequest'
      responses:
        '201':
          description: Record has been created
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DcatCatalogRecord'
        '202':
          description: Accepted; ordered publication continues at the Location monitor
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /3/records/{recordId}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Get record metadata
      description: >-
        Returns administrative metadata as one DCAT 3 JSON-LD catalog record. Tombstones remain addressable with
        the current ETag so an authorized client can restore them conditionally. They are identified by
        publicationStatus ending in /WITHDRAWN together with invalidatedAtTime; DELETED is only the internal
        lifecycle value because the EU Dataset Status vocabulary has no DELETED concept. Published records are public; restricted
        states require records:read. A permanently purged or unknown ID returns 404.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Current record state without RDF content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DcatCatalogRecord'
              examples:
                catalogRecord:
                  $ref: '#/components/examples/DcatRecordMetadata'
        '304':
          description: The current record state has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags: [Records]
      operationId: headRecord
      summary: Inspect record metadata headers
      description: >-
        Applies the same conditions and authorization as GET without returning the
        administrative metadata body.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Headers for the current record state
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '304':
          description: The current record state has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Records]
      operationId: putRecord
      summary: Update a record
      description: >-
        The complete RDF/XML is parsed with Apache Jena RIOT before persistence.
        The record must already exist and its current ETag is required in If-Match.
        The ID supplied in the metadata must equal the path ID and is never changed.
        A 202 response links to the monitor.
      security:
        - oauth2: [records:write]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        $ref: '#/components/requestBodies/RecordWriteRequest'
      responses:
        '200':
          description: Record updated or left unchanged by an idempotent retry
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DcatCatalogRecord'
        '202':
          description: Accepted; ordered publication continues at the Location monitor
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Records]
      operationId: patchRecordLifecycle
      summary: Create or remove a record tombstone
      description: >-
        Changes only the record lifecycle state. publicationStatus=DELETED creates a
        tombstone without physically erasing retained content.
        publicationStatus=PUBLISHED restores the retained non-deleted content.
        Repeating the current target state is idempotent. Every
        transition requires the current state ETag.
      security:
        - oauth2: [records:write]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        $ref: '#/components/requestBodies/RecordLifecyclePatchRequest'
      responses:
        '200':
          description: Lifecycle transition completed or target state already active
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/DcatCatalogRecord'
        '202':
          description: Accepted; ordered lifecycle publication continues at Location
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Records]
      operationId: deleteRecord
      summary: Permanently purge a record
      description: >-
        Irreversibly removes the record, its retained source content,
        its tombstone, and derived representations. This exceptional administrative
        operation is not a lifecycle transition and cannot be undone. The
        records:purge scope is issued only to administrative principals; possession
        of the scope is necessary but the server must also enforce its independent
        administrator policy, retention rules, and legal holds. Purging may complete
        asynchronously across storage, search, and cache systems.
      security:
        - oauth2: [records:purge]
      x-authorization-policy:
        principalType: ADMIN
        exceptionalAccess: true
        scopeIsNecessaryButNotSufficient: true
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequiredIfMatch'
        - $ref: '#/components/parameters/PurgeReason'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '202':
          description: Administrative purge accepted and continuing at Location
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteOperation'
        '204':
          description: Record permanently purged, or identical purge retry completed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /3/records/{recordId}/content:
    get:
      tags: [Records]
      operationId: getRecordContent
      summary: Get record RDF
      description: >-
        Returns exactly one record graph. Accept selects any production RDF format
        emitted by Apache Jena RIOT: RDF/XML, JSON-LD, Turtle, N-Triples, N-Quads,
        RDF/JSON, TriG, TriX, RDF Thrift, or RDF Protobuf. N3 is represented by its
        equivalent Turtle serialization. Internal RDF/null, RDF/raw, and SHACL-C are
        not RDF graph output formats and are not exposed. Derived serializations cost
        more and have distinct ETags; no cross-record query is performed. A tombstone
        has no current RDF representation and returns 410 Gone for both GET and HEAD,
        even when retained bytes still exist for audit or restoration.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Record content in the negotiated RDF serialization
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Content-SHA256:
              $ref: '#/components/headers/ContentSha256'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/rdf+xml:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
              examples:
                simpleEdmRecord:
                  $ref: '#/components/examples/SimpleEdmRdfXml'
                enrichedEdmRecord:
                  $ref: '#/components/examples/EnrichedEdmRdfXml'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
              examples:
                simpleEdmRecord:
                  $ref: '#/components/examples/SimpleEdmJsonLd'
                enrichedEdmRecord:
                  $ref: '#/components/examples/EnrichedEdmJsonLd'
            text/turtle:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
              examples:
                simpleEdmRecord:
                  $ref: '#/components/examples/SimpleEdmTurtle'
                enrichedEdmRecord:
                  $ref: '#/components/examples/EnrichedEdmTurtle'
            application/n-triples:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
              examples:
                simpleEdmRecord:
                  $ref: '#/components/examples/SimpleEdmNTriples'
                enrichedEdmRecord:
                  $ref: '#/components/examples/EnrichedEdmNTriples'
            application/n-quads:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
              examples:
                simpleEdmRecord:
                  $ref: '#/components/examples/SimpleEdmNQuads'
                enrichedEdmRecord:
                  $ref: '#/components/examples/EnrichedEdmNQuads'
            application/rdf+json:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
            application/trig:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
            application/trix:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
            application/rdf+thrift:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
            application/rdf+protobuf:
              schema:
                $ref: '#/components/schemas/RdfRepresentation'
        '304':
          description: The selected representation has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags: [Records]
      operationId: headRecordContent
      summary: Inspect record RDF headers
      description: >-
        Applies the same negotiation and conditions as GET but returns no body.
        Content-Length may be absent for a representation generated on demand.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Metadata for the negotiated content representation
          headers:
            Content-Length:
              description: Byte length when known for the selected representation
              schema:
                type: integer
                format: int64
                minimum: 0
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Content-SHA256:
              $ref: '#/components/headers/ContentSha256'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '304':
          description: The selected representation has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /3/records/{recordId}/representations:
    get:
      tags: [Records]
      operationId: getRecordRepresentations
      summary: List record representations
      description: >-
        Lists the available canonical, source, and derived representations for the
        current record state. Every item has a concrete URL and media type. Source
        items identify their public metadata format; application profiles are
        included only when applicable. Listing the catalog does not parse or convert
        record content.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Available representations of the current record state
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordRepresentationList'
              examples:
                edmSourceAndDisplay:
                  $ref: '#/components/examples/RecordRepresentations'
        '304':
          description: The representation catalog has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      tags: [Records]
      operationId: headRecordRepresentations
      summary: Inspect record representation catalog headers
      description: >-
        Applies the same conditions and authorization as GET without returning the
        representation catalog body.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Headers for the representation catalog
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '304':
          description: The representation catalog has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
