  /3/records:batchGet:
    post:
      tags: [Records]
      operationId: batchGetRecords
      summary: Get a record batch
      description: >-
        Preserves request order and reports 200, 404, or 410 per item; outer 200 only
        confirms batch execution. The limit is 1,000 or lower by client policy.
        POST responses are not CDN-cacheable. include=METADATA returns
        application/x-ndjson. include=CONTENT returns multipart/mixed; every successful
        part contains the canonical stored RDF/XML with Content-Type
        application/rdf+xml. There is no RDF format selector for batch content and no
        Jena conversion is performed. HTTP Accept selects only the outer response
        format and must match include.
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetRequest'
      responses:
        '200':
          description: >-
            Streamed per-item results. NDJSON is used for metadata and
            multipart/mixed for content. Successful content parts are always
            application/rdf+xml; failed parts are application/problem+json. Each item
            status is carried in the item itself or in the part headers. The order is
            identical to recordIds. HTTP Content-Encoding, when present, applies to
            the complete response entity; individual MIME parts are not encoded.
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
                description: UTF-8 NDJSON with one BatchGetItem line per record ID
              x-ndjson-item-schema:
                $ref: '#/components/schemas/BatchGetItem'
            multipart/mixed:
              schema:
                type: string
                format: binary
                description: >-
                  MIME multipart stream. Each part has Content-ID, X-Record-Id,
                  X-Part-Status, and either canonical RDF/XML or Problem Details. The
                  actual HTTP Content-Type carries the boundary parameter, for example
                  multipart/mixed; boundary=batch-get. MIME lines use CRLF on the wire.
              x-multipart-item-schema:
                $ref: '#/components/schemas/BatchGetContentPart'
              examples:
                contentAndTombstone:
                  summary: One RDF/XML record followed by one tombstone
                  value: |-
                    --batch-get
                    Content-Type: application/rdf+xml
                    Content-ID: <item-1@api.deutsche-digitale-bibliothek.de>
                    X-Record-Id: ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
                    X-Part-Status: 200
                    ETag: "rdfxml-stored-sha256-example"

                    <?xml version="1.0" encoding="UTF-8"?>
                    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
                      <rdf:Description rdf:about="https://example.org/record/1"/>
                    </rdf:RDF>
                    --batch-get
                    Content-Type: application/problem+json
                    Content-ID: <item-2@api.deutsche-digitale-bibliothek.de>
                    X-Record-Id: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                    X-Part-Status: 410

                    {"type":"about:blank","title":"Gone","status":410,"detail":"The record has a tombstone and no current content.","requestId":"018f6c1a-7b2d-7f3e-a9c1-4b5d6e7f8090","code":"RECORD_GONE"}
                    --batch-get--
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /3/records:batchWrite:
    post:
      tags: [Records]
      operationId: batchWriteRecords
      summary: Write a small record batch
      description: >-
        Accepts at most 100 records and 100 MiB after HTTP content decoding. The
        outer entity is multipart/mixed and preserves item order. Every outer MIME
        part is a multipart/related record envelope whose Content-Type requires
        type="application/json" and a start parameter selecting its metadata part.
        The envelope also requires a unique Content-ID, an Idempotency-Key, and
        exactly one of If-Match or If-None-Match: *. Its inner parts are metadata
        (application/json), canonical content
        (application/rdf+xml), and optionally the retained non-RDF source document.
        No other RDF input serialization is accepted. Every item carries its externally
        assigned record ID in metadata. Items commit independently; outer 200
        therefore permits partial success. gzip, when selected by the HTTP
        Content-Encoding header, applies once to the complete multipart/mixed entity;
        individual MIME parts must not have Content-Encoding. MIME boundaries and
        header lines use CRLF on the wire. A failure that prevents reliable
        enumeration of the outer parts, including invalid top-level MIME, HTTP
        decoding, missing or duplicate outer Content-ID, or an exceeded batch limit,
        rejects the whole request before any item commits. After that structural
        check, envelope-level failures are reported per item in the NDJSON response.
        This nested multipart contract requires byte-level integration tests because
        OpenAPI cannot model it natively.
      security:
        - oauth2: [records:write]
      parameters:
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: string
              format: binary
              description: >-
                Nested MIME batch defined by BatchWriteRecordEnvelope. Each outer
                part is multipart/related and contains JSON metadata, exactly one
                RDF/XML content part, and optionally one retained source part.
            x-multipart-item-schema:
              $ref: '#/components/schemas/BatchWriteRecordEnvelope'
      responses:
        '200':
          description: >-
            NDJSON with exactly one result for each outer Content-ID, in request order.
            Each line reports its own status; partial success is possible.
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
              x-ndjson-item-schema:
                $ref: '#/components/schemas/BatchWriteItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /3/records:validate:
    post:
      tags: [Records]
      operationId: validateRecord
      summary: Validate an RDF/XML record
      description: >-
        Validates RDF/XML against the selected profile without storage or change
        event. 200 with conforms=false means validation completed; 422 means the
        input could not be evaluated.
      security:
        - oauth2: [records:validate]
      parameters:
        - name: profileVersion
          in: query
          required: true
          description: Exact EDM application-profile version
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/RequestContentEncoding'
        - $ref: '#/components/parameters/AcceptEncoding'
      requestBody:
        required: true
        content:
          application/rdf+xml:
            schema:
              $ref: '#/components/schemas/RdfXmlDocument'
            examples:
              simpleEdmRecord:
                $ref: '#/components/examples/SimpleEdmRdfXml'
              enrichedEdmRecord:
                $ref: '#/components/examples/EnrichedEdmRdfXml'
      responses:
        '200':
          description: Complete validation result, including when conforms is false
          headers:
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 Client Credentials. Authentication is optional for operations that
        explicitly include the anonymous security alternative.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            records:read: Read records and the change feed
            records:write: Create and replace records
            records:purge: Permanently purge records; issued to administrators only
            records:validate: Validate RDF/XML without storing it
            imports:read: Read the client's import jobs
            imports:write: Create, start, and cancel import jobs
            exports:read: Read the client's export jobs
            exports:write: Create export jobs

  examples:
    DcatRecordMetadata:
      summary: Administrative metadata as a DCAT 3 catalog record
      description: >-
        API-owned links are relative in this portable contract example. The running service derives
        them from DDB_API_PUBLIC_BASE_URL. Stable item, dataset and organization identifiers use the
        separately configurable DDB_RESOURCE_BASE_URL.
      value:
        '@context': /contexts/record-metadata-v1.jsonld
        '@id': /3/records/ABCDEFGHIJKLMNOPQRSTUVWXYZ234567#metadata
        '@type': dcat:CatalogRecord
        primaryTopic:
          '@id': https://www.deutsche-digitale-bibliothek.de/item/ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
          '@type': dcat:Dataset
          recordId: ABCDEFGHIJKLMNOPQRSTUVWXYZ234567
          datasets:
            - https://www.deutsche-digitale-bibliothek.de/dataset/BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          provider: https://www.deutsche-digitale-bibliothek.de/organization/CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          aggregator: https://www.deutsche-digitale-bibliothek.de/organization/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          sourceIdentifier:
            '@type': adms:Identifier
            notation: source-001
          publicationStatus: http://publications.europa.eu/resource/authority/dataset-status/COMPLETED
          validationAssertion:
            '@id': /3/records/ABCDEFGHIJKLMNOPQRSTUVWXYZ234567#validation
            '@type': earl:Assertion
            test: /profiles/edm/ddb-v3
            mode: earl:automatic
            result:
              '@type': earl:TestResult
              outcome: earl:passed
        createdAt: '2026-01-01T12:00:00Z'
        modifiedAt: '2026-01-02T09:30:00Z'

    SimpleEdmRdfXml:
      summary: Minimal EDM record with a ProvidedCHO and its aggregation
      description: >-
        Illustrative RDF/XML. A selected application profile may require additional
        properties or apply stricter controlled vocabularies.
      value: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <rdf:RDF
            xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
            xmlns:dc="http://purl.org/dc/elements/1.1/"
            xmlns:edm="http://www.europeana.eu/schemas/edm/"
            xmlns:ore="http://www.openarchives.org/ore/terms/">
          <edm:ProvidedCHO rdf:about="/resource/cho/demo-001">
            <dc:title xml:lang="en">Example cultural heritage object</dc:title>
            <edm:type>IMAGE</edm:type>
          </edm:ProvidedCHO>
          <ore:Aggregation rdf:about="/resource/aggregation/demo-001">
            <edm:aggregatedCHO rdf:resource="/resource/cho/demo-001"/>
            <edm:dataProvider xml:lang="en">Example Museum</edm:dataProvider>
            <edm:provider>Deutsche Digitale Bibliothek</edm:provider>
            <edm:isShownAt rdf:resource="https://www.deutsche-digitale-bibliothek.de/item/demo-001"/>
            <edm:rights rdf:resource="http://creativecommons.org/publicdomain/mark/1.0/"/>
          </ore:Aggregation>
        </rdf:RDF>

    EnrichedEdmRdfXml:
      summary: EDM record with an agent, place, web resource, and aggregation
      description: >-
        Illustrative RDF/XML with several resources in one technical record. A
        selected application profile may require additional properties.
      value: |-
        <?xml version="1.0" encoding="UTF-8"?>
        <rdf:RDF
            xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
            xmlns:dc="http://purl.org/dc/elements/1.1/"
            xmlns:dcterms="http://purl.org/dc/terms/"
            xmlns:edm="http://www.europeana.eu/schemas/edm/"
            xmlns:ore="http://www.openarchives.org/ore/terms/"
            xmlns:skos="http://www.w3.org/2004/02/skos/core#"
            xmlns:wgs84="http://www.w3.org/2003/01/geo/wgs84_pos#">
          <edm:ProvidedCHO rdf:about="/resource/cho/demo-002">
            <dc:title xml:lang="en">Portrait of Ada Lovelace</dc:title>
            <dc:creator rdf:resource="/resource/agent/demo-002"/>
            <dcterms:spatial rdf:resource="/resource/place/demo-002"/>
            <edm:type>IMAGE</edm:type>
          </edm:ProvidedCHO>
          <edm:Agent rdf:about="/resource/agent/demo-002">
            <skos:prefLabel xml:lang="en">Ada Lovelace</skos:prefLabel>
          </edm:Agent>
          <edm:Place rdf:about="/resource/place/demo-002">
