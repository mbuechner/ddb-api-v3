openapi: 3.1.0
info:
  title: DDB API v3
  version: 3.0.0-dev
  contact:
    name: Michael Büchner
    email: m.buechner@dnb.de
    url: https://github.com/mbuechner/ddb-api-v3
  description: >-
    Create, retrieve and replace RDF records identified by 32-character DDB IDs.
    Uploads use RDF/XML. Responses support JSON-LD (the default), RDF/XML and
    Jelly RDF. Reads are public; writes require a Bearer token with records:write.
    Each record is an RDF dataset with a single named graph whose versionless
    public IRI ends in /records/{recordId}. HTTP endpoints use /3.
    Versionless record URLs redirect to their versioned endpoints with 308;
    authentication also applies to redirected writes. Requests support gzip.
servers:
  - url: https://api.deutsche-digitale-bibliothek.de
    description: Public API

security:
  - bearerAuth: []

tags:
  - name: Records
    description: RDF records identified by DDB IDs.

paths:
  /3/records/{recordId}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Retrieve an RDF record
      description: >-
        Return the complete record in the format selected by Accept; JSON-LD is
        the default. JSON-LD includes an inline @context and a named @graph.
        Jelly RDF also preserves the graph name. RDF/XML represents the graph's
        triples with flat, typed nodes where possible. Absolute IRIs are preserved.
        Use If-None-Match for conditional reads and the strong X-Record-ETag
        value for subsequent replacements. The response ETag is weak and cannot
        be used with PUT If-Match.
      security: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Complete RDF dataset in the negotiated serialization
          headers:
            ETag:
              $ref: '#/components/headers/WeakETag'
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              description: Response selection depends on RDF and HTTP content negotiation
              schema:
                type: string
                example: Accept, Accept-Encoding
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/rdf+xml:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/x-jelly-rdf:
              schema:
                $ref: '#/components/schemas/RdfDocument'
        '304':
          description: The record matches If-None-Match; no response body
          headers:
            ETag:
              $ref: '#/components/headers/WeakETag'
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              description: Response selection depends on Accept and Accept-Encoding
              schema:
                type: string
                example: Accept, Accept-Encoding
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Records]
      operationId: createRecord
      summary: Create an RDF record
      description: >-
        Validate RDF/XML syntax and create a record under the
        supplied DDB ID. An existing record is never overwritten and returns 409.
        The successful response has no body and includes the record location
        and a strong revision validator in ETag.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        $ref: '#/components/requestBodies/RdfRecord'
      responses:
        '201':
          description: RDF record created
          headers:
            Location:
              description: API location of the record document
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Records]
      operationId: putRecord
      summary: Replace an RDF record
      description: >-
        Validate RDF/XML syntax and replace an existing record
        only when If-Match matches its current revision. A missing precondition
        returns 428; a failed precondition, including a missing record, returns
        412. The successful response has no body and provides the new revision
        validator in X-Record-ETag. PUT does not return ETag.
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/RdfRecord'
      responses:
        '204':
          description: RDF record replaced
          headers:
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A Bearer access token with records:write permits creating and replacing
        records under any DDB ID. Read operations do not require a token.

  parameters:
    RecordId:
      name: recordId
      in: path
      required: true
      description: Externally assigned 32-character DDB ID, RFC 4648 Base32 without padding
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[A-Z2-7]{32}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Required for replacement; omission returns 428. Supply a quoted current
        revision validator from POST ETag or GET/PUT X-Record-ETag, a comma-separated ETag list,
        or * by itself to require an existing
        record. Weak tags never match. A malformed header is rejected as a whole.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        Return 304 without a body if the current dataset matches an ETag in this
        list. Weak comparison is used; * matches any existing record.
      schema:
        type: string

  headers:
    ETag:
      description: Strong opaque record revision validator, including quotation marks
      schema:
        type: string
    WeakETag:
      description: Weak record validator, for example W/"revision"; cannot be used for PUT If-Match
      schema:
        type: string
    RequestId:
      description: Identifier for correlating the HTTP request with server logs
      schema:
        type: string

  requestBodies:
    RdfRecord:
      required: true
      description: >-
        A complete RDF/XML document containing at least one triple. Its triples
        form the record's single named graph. Use xml:base="/" with versionless,
        root-relative references such
        as /records/{recordId} and /items/{recordId}. Absolute IRIs remain unchanged;
        an explicit absolute xml:base controls resolution of relative IRIs.
        With xml:base="/", an empty rdf:about
        or a fragment-only reference identifies the origin root or its fragment,
        not the record. The upload size limit applies after content decoding,
        including gzip decompression.
      content:
        application/rdf+xml:
          schema:
            $ref: '#/components/schemas/RdfDocument'

  schemas:
    RdfDocument:
      type: string
      format: binary
    Problem:
      type: object
      description: RFC 9457 problem details with a requestId for diagnostics
      additionalProperties: true
      required: [title, status, requestId]
      properties:
        type:
          description: Problem type URI; when omitted, RFC 9457 defines about:blank as the default
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string

  responses:
    BadRequest:
      description: Invalid request; write operations also reject malformed DDB IDs
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid Bearer credentials; the response body may be empty
      headers:
        WWW-Authenticate:
          description: Bearer challenge, optionally including an invalid_token error
          schema:
            type: string
    Forbidden:
      description: Credentials do not permit the operation; the response body may be empty
      headers:
        WWW-Authenticate:
          description: Bearer challenge, optionally including an insufficient_scope error
          schema:
            type: string
    Conflict:
      description: An RDF record already exists under this DDB ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No RDF record exists at the requested path, including identifiers outside the DDB ID syntax
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: Accept does not allow JSON-LD, RDF/XML or Jelly RDF, or the chosen format cannot represent this RDF dataset
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not identify the current existing RDF record
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Replacement requires an If-Match header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: RDF document exceeds the upload size limit after content decoding
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type does not identify RDF/XML
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request body is not valid RDF/XML or contains no triples
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Request limit exceeded
    ServiceUnavailable:
      description: The service is temporarily unable to process the request
      headers:
        Retry-After:
          description: Suggested delay in seconds before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
