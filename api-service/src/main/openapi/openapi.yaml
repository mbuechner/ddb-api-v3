  parameters:
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RecordIdValue'
      description: Externally assigned record ID, RFC 4648 Base32 without padding, 32 characters
    DisplayProfile:
      name: profile
      in: query
      required: false
      description: >-
        Frontend projection profile. The default is ddb. Profile revisions remain
        backward compatible within API v3; incompatible revisions require a new
        profile identifier.
      schema:
        type: string
        enum: [ddb, ccc, apd]
        default: ddb
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Return 304 when the selected representation matches
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: State ETag for optimistic concurrency control
      schema:
        type: string
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current state ETag required for this mutation
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Canonical lowercase UUID scoped to client, method, and normalized URI.
        Identical retries are replayed for seven days; reuse with a different request
        fingerprint returns 409. UUIDv7 is recommended. Never encode sensitive data.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: 018f6c1a-7b2d-7f3e-a9c1-4b5d6e7f8091
    PurgeReason:
      name: X-Purge-Reason
      in: header
      required: true
      description: >-
        Required audit reason for an irreversible administrative purge. Use a ticket
        reference, short code, or text; never include secrets or unnecessary personal
        data.
      schema:
        type: string
        minLength: 3
        maxLength: 512
        pattern: '.*\S.*'
        example: privacy-case-2026-0042
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: Used only when If-None-Match is absent
      schema:
        type: string
        format: http-date
    AcceptEncoding:
      name: Accept-Encoding
      in: header
      required: false
      description: >-
        Supported response content codings are gzip and identity. Quality values are
        honored. If neither coding is acceptable, the server returns 406.
      schema:
        type: string
        example: gzip, identity;q=0.5
    RequestContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: >-
        Content coding of the complete request body. gzip and identity are supported;
        identity is assumed when the header is absent. Limits apply after decoding.
      schema:
        type: string
        enum: [gzip, identity]
        default: identity

  headers:
    ContentLength:
      required: false
      description: Byte length when the selected representation is materialized
      schema:
        type: integer
        format: int64
        minimum: 0
    Location:
      required: true
      description: Created resource or asynchronous status monitor
      schema:
        type: string
        format: uri-reference
    ETag:
      required: true
      description: >-
        Entity tag for the selected media type and content coding. Strong tags differ
        between identity and gzip representations; weak tags may be shared only when
        their weak comparison semantics are sufficient.
      schema:
        type: string
    LastModified:
      required: true
      schema:
        type: string
        format: http-date
    CacheControl:
      required: true
      schema:
        type: string
    ContentEncoding:
      required: false
      description: >-
        Content coding applied to the response representation. The header is absent
        for identity. Content-Length, when present, is the encoded byte length.
      schema:
        type: string
        const: gzip
    VaryAcceptEncoding:
      required: true
      schema:
        type: string
        const: Accept, Accept-Encoding
    ProfileLink:
      required: true
      description: RFC 8288 Link with rel="profile" for the selected representation
      schema:
        type: string
    SourceLinks:
      required: true
      description: >-
        RFC 8288 Link values. Exactly one rel="type" target is the public,
        authoritative metadata-format URI. An optional rel="profile" target identifies
        additional DDB/API constraints. Example: <https://lido-schema.org/>;
        rel="type", </profiles/source/lido/ddb/1>;
        rel="profile".
      schema:
        type: string
    ContentSha256:
      required: true
      description: Hexadecimal SHA-256 of the canonical uncompressed RDF/XML content
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    SourceSha256:
      required: true
      description: Hexadecimal SHA-256 of the original uncompressed source bytes
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    RequestId:
      required: true
      description: Correlation ID for this HTTP request
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RetryAfter:
      description: >-
        Recommended retry time. A non-negative delay in seconds is preferred; an
        HTTP-date can be used when an absolute time is required.
      schema:
        # HTTP field values are textual on the wire. Modelling both lexical forms as a
        # string avoids an anonymous primitive oneOf that Java generators cannot represent.
        type: string
        minLength: 1
        examples:
          - '120'
          - 'Wed, 21 Oct 2015 07:28:00 GMT'

  requestBodies:
    RecordWriteRequest:
      required: true
      description: >-
        Canonical RDF/XML is required and the content part has the fixed media type
        application/rdf+xml; no other RDF input serialization is accepted. The outer
        request remains multipart/form-data so record metadata can be transmitted
        without custom headers. An optional non-RDF source part preserves the exact
        original XML. sourceMediaType, sourceFormat, sourceFormatUri, and
        sourceFormatVersion are then required in metadata. sourceProfile and
        sourceProfileUri are optional and must occur together. These conditional
        constraints are enforced by the application.
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [metadata, content]
            properties:
              metadata:
                $ref: '#/components/schemas/RecordWriteMetadata'
              content:
                type: string
                format: binary
                description: UTF-8 encoded RDF/XML document
              source:
                type: string
                format: binary
                description: >-
                  Optional exact original LIDO, EAD, METS, MODS, or other XML. This is
                  retained provenance, not an alternative RDF record input.
          encoding:
            metadata:
              contentType: application/json
            content:
              contentType: application/rdf+xml
            source:
              contentType: application/xml, application/mets+xml, application/mods+xml
    RecordLifecyclePatchRequest:
      required: true
      description: >-
        A merge patch for the lifecycle status only. DELETED creates a tombstone;
        PUBLISHED restores the latest retained non-deleted content. A deletionReason
        is required when creating a tombstone and must be the absolute IRI of a
        concept in a controlled vocabulary. An optional deletionComment is public
        tombstone metadata and must not contain confidential or personal data.
      content:
        application/merge-patch+json:
          schema:
            $ref: '#/components/schemas/RecordLifecyclePatch'

  schemas:
    RdfRepresentation:
      type: string
      format: binary
      description: >-
        Streamed RDF bytes. The response Content-Type selects RDF/XML, JSON-LD,
        Turtle, N-Triples, N-Quads, RDF/JSON, TriG, TriX, RDF Thrift, or RDF
        Protobuf. RDF/XML is returned byte-for-byte from storage; only another
        selected media type causes parsing and serialization with Apache Jena RIOT.

    RdfXmlDocument:
      type: string
      format: binary
      description: >-
        UTF-8 RDF/XML bytes. RDF is an open graph format and is therefore represented
        as a streamed binary body rather than as a generated Java object model.

    DisplayDocument:
      type: object
      additionalProperties: false
      description: >-
        Stable envelope for a frontend-specific projection. The versioned profile
        URI defines the open data object. Volatile generation timestamps are
        deliberately excluded so identical projections have identical bytes.
      required:
        - recordId
        - profile
        - profileVersion
        - profileUri
        - data
      properties:
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
        profile:
          type: string
          enum: [ddb, ccc, apd]
        profileVersion:
          type: string
          minLength: 1
          maxLength: 32
        profileUri:
          type: string
          format: uri-reference
        data:
          type: object
          additionalProperties: true
          description: Payload governed by profileUri

    RecordRepresentationList:
      type: object
      additionalProperties: false
      required: [recordId, items]
      properties:
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordRepresentation'

    RecordRepresentation:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - href
        - mediaTypes
        - generatedOnDemand
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        role:
          type: string
          enum: [CANONICAL, SOURCE, DERIVED]
        href:
          type: string
          format: uri-reference
        mediaTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        format:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{0,31}$'
          description: Short notation for the public metadata format; required for SOURCE
        formatUri:
          type: string
          format: uri
          description: Public authoritative metadata-format URI; required for SOURCE
        formatVersion:
          type: string
          minLength: 1
          maxLength: 64
          description: Source format version; required for SOURCE
        profile:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
          description: Optional short notation for an application profile
        profileUri:
          type: string
          format: uri-reference
          description: Optional URI for constraints beyond the base metadata format
        profileVersion:
          type: string
          minLength: 1
          maxLength: 128
        generatedOnDemand:
          type: boolean
        contentLength:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        etag:
          type: string

    RecordIdValue:
      type: string
      pattern: '^[A-Z2-7]{32}$'
      minLength: 32
      maxLength: 32
      description: >-
        Externally assigned, globally unique DDB ID. The API validates and stores
        the identifier but never derives or replaces it. Records, datasets and
        organizations each have their own independent DDB ID.

    SourceFormatCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_-]{0,31}$'
      examples: [LIDO, EAD, METS, MODS]
      description: >-
        Short notation for a public metadata format. It is not the format identifier;
        sourceFormatUri carries the authoritative public URI. New registered formats
        do not require a new API version.

    RecordWriteMetadata:
      type: object
      additionalProperties: false
      required: [recordId, datasetIds, providerId, sourceId, publicationStatus, profileVersion]
      properties:
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
          description: Immutable ID supplied by the owning system
        datasetIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecordIdValue'
          description: DDB IDs of all datasets containing this record
        providerId:
          $ref: '#/components/schemas/RecordIdValue'
          description: DDB ID of the organization providing the record
        aggregatorId:
          $ref: '#/components/schemas/RecordIdValue'
          description: Optional DDB ID of the organization aggregating the provider's data
        sourceId:
          type: string
          minLength: 1
          maxLength: 2048
        publicationStatus:
          type: string
          enum: [DRAFT, PUBLISHED]
        profileVersion:
          type: string
          minLength: 1
          maxLength: 128
        clientRecordReference:
          type: string
          maxLength: 256
        sourceMediaType:
          type: string
          enum: [application/xml, application/mets+xml, application/mods+xml]
          description: Required when the multipart request contains source
        sourceFormat:
          $ref: '#/components/schemas/SourceFormatCode'
        sourceFormatUri:
          type: string
          format: uri
          examples:
            - https://lido-schema.org/
            - https://www.loc.gov/ead/
            - https://www.loc.gov/standards/mets/
            - https://www.loc.gov/standards/mods/
          description: >-
            Required with source. Public authoritative metadata-format URI, never a
            DDB/API profile URI.
        sourceFormatVersion:
          type: string
          minLength: 1
          maxLength: 64
          description: Required with source; exact format or schema version
        sourceProfile:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
          description: Optional DDB/API application-profile notation
        sourceProfileUri:
          type: string
          format: uri-reference
          description: >-
            Optional URI for constraints beyond the public metadata format; must
            occur together with sourceProfile

    RecordLifecyclePatch:
      type: object
      additionalProperties: false
      required: [publicationStatus]
      properties:
        publicationStatus:
          type: string
          enum: [PUBLISHED, DELETED]
          description: >-
            DELETED creates a tombstone. PUBLISHED restores the latest retained
            non-deleted content when the current state is DELETED.
        deletionReason:
          type: string
          format: uri
          description: >-
            Required when publicationStatus is DELETED. Absolute IRI of a concept
            in the deletion-reason vocabulary selected by the API operator.
        deletionComment:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '.*\S.*'
          description: >-
            Optional public, human-readable explanation. Must not contain
            confidential or personal data.
      allOf:
        - if:
            properties:
              publicationStatus:
                const: DELETED
          then:
            required: [deletionReason]

    WriteOperation:
      type: object
      additionalProperties: false
      required: [operationId, status, createdAt]
      properties:
        operationId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          type: string
          enum:
            - STAGED
            - PENDING_PUBLICATION
            - PUBLISHED
            - PENDING_PURGE
            - PURGED
            - FAILED
        createdAt:
          type: string
          format: date-time
        recordId:
          anyOf:
            - $ref: '#/components/schemas/RecordIdValue'
            - type: 'null'
        problem:
          $ref: '#/components/schemas/Problem'

    ValidationReport:
      type: object
      additionalProperties: false
      required:
        - conforms
        - validationStatus
        - profileVersion
        - contentSha256
        - contentLength
        - errors
        - warnings
      properties:
        conforms:
          type: boolean
        validationStatus:
          type: string
          enum: [VALID, VALID_WITH_WARNINGS, INVALID]
        profileVersion:
          type: string
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        contentLength:
          type: integer
          format: int64
          minimum: 0
        extractedMetadata:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [WARNING, ERROR]
        focusNode:
          type: string
        path:
          type: string
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1

    BatchGetRequest:
      type: object
      additionalProperties: false
      required: [recordIds, include]
      properties:
        recordIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecordIdValue'
        include:
          type: string
          description: >-
            METADATA returns NDJSON. CONTENT returns multipart/mixed whose successful
            parts are always application/rdf+xml.
          enum: [METADATA, CONTENT]

    BatchGetContentPart:
      type: object
      additionalProperties: false
      description: >-
        Logical schema for one multipart/mixed response part. Header-named properties
        are MIME part headers. A successful part contains the canonical stored
        RDF/XML; a 404 or 410 part contains Problem Details instead.
      required: [contentId, recordId, status]
      properties:
        contentId:
          type: string
          description: MIME Content-ID, unique within the response
          x-mime-header: Content-ID
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
          x-mime-header: X-Record-Id
        status:
          type: integer
          enum: [200, 404, 410]
          x-mime-header: X-Part-Status
        etag:
          type: string
          x-mime-header: ETag
        content:
          type: string
          format: binary
          contentMediaType: application/rdf+xml
          description: Present only for status 200
          x-mime-content-type: application/rdf+xml
        problem:
          $ref: '#/components/schemas/Problem'
          description: Present only for status 404 or 410
          x-mime-content-type: application/problem+json
      allOf:
        - if:
            properties:
              status:
                const: 200
          then:
            required: [etag, content]
          else:
            required: [problem]

    BatchGetItem:
      type: object
      additionalProperties: false
      required: [recordId, status]
      properties:
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
        status:
          type: integer
          enum: [200, 404, 410]
        metadata:
          $ref: '#/components/schemas/DcatCatalogRecord'
        problem:
          $ref: '#/components/schemas/Problem'

    BatchWriteRecordEnvelope:
      type: object
      additionalProperties: false
      description: >-
        Logical schema for one outer multipart/mixed part. Header-named properties
        are MIME part headers, not top-level HTTP headers. metadata, content, and
        source represent the nested multipart/related parts. OpenAPI tooling must use
        this schema together with the normative wire description and example.
      required: [contentId, idempotencyKey, metadata, content]
      properties:
        contentId:
          type: string
          minLength: 1
          maxLength: 256
          description: Outer MIME Content-ID, unique within the request
          x-mime-header: Content-ID
        idempotencyKey:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Per-record idempotency key
          x-mime-header: Idempotency-Key
        ifMatch:
          type: string
          description: Current state ETag for replacement
          x-mime-header: If-Match
        ifNoneMatch:
          type: string
          const: '*'
          description: Required for creation; the only permitted value is an asterisk
          x-mime-header: If-None-Match
        metadata:
          $ref: '#/components/schemas/RecordWriteMetadata'
          description: >-
            Required inner part with Content-Type application/json and the Content-ID
            selected by the multipart/related start parameter
          x-mime-content-type: application/json
        content:
          type: string
          format: binary
          description: Required inner part with Content-Type application/rdf+xml
          contentMediaType: application/rdf+xml
          x-mime-content-type: application/rdf+xml
        source:
          type: string
          format: binary
          description: >-
            Optional retained source inner part. Its Content-Type must equal the
            sourceMediaType declared by metadata.
      allOf:
        - oneOf:
            - required: [ifMatch]
              not:
                required: [ifNoneMatch]
            - required: [ifNoneMatch]
              not:
                required: [ifMatch]

    BatchWriteItem:
      type: object
      additionalProperties: false
      required: [contentId, status]
      properties:
        contentId:
          type: string
          description: >-
            Normalized value of the request part's Content-ID header, without angle
            brackets
          minLength: 1
          maxLength: 256
        status:
          type: integer
          enum: [200, 201, 400, 403, 404, 409, 412, 413, 415, 422, 428, 429, 503]
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
        etag:
          type: string
          description: Current state ETag for a successful item
        problem:
          $ref: '#/components/schemas/Problem'

    DcatCatalogRecord:
      type: object
      additionalProperties: false
      description: >-
        The single administrative metadata representation for a record. It is a compacted JSON-LD
        1.1 document whose root is dcat:CatalogRecord. Its versioned external context uses only
        DCAT 3, Dublin Core, FOAF, ADMS, SKOS, PROV-O, EARL and EDM terms.
        DDB URLs identify resources and application profiles, but define no vocabulary terms.
      required:
        - '@context'
        - '@id'
        - '@type'
        - primaryTopic
        - createdAt
        - modifiedAt
      properties:
        '@context':
          type: string
          format: uri-reference
          description: Absolute IRI of the versioned JSON-LD 1.1 context document
        '@id':
          type: string
          format: uri-reference
          description: IRI identifying this dcat:CatalogRecord metadata entity
        '@type':
          type: string
          const: dcat:CatalogRecord
        primaryTopic:
          $ref: '#/components/schemas/DcatDataset'
        createdAt:
          type: string
          format: date-time
          description: dcterms:issued date of the catalog record
        modifiedAt:
          type: string
          format: date-time
          description: dcterms:modified date of the catalog record
    DcatDataset:
      type: object
      additionalProperties: false
      description: >-
        The dataset described by the surrounding dcat:CatalogRecord. In this API each
        record is a DCAT dataset; EDM is used only for facts that DCAT cannot express.
      required:
        - '@id'
        - '@type'
        - recordId
        - datasets
        - provider
        - publicationStatus
        - validationAssertion
      properties:
        '@id':
          type: string
          format: uri-reference
        '@type':
          type: string
          const: dcat:Dataset
        recordId:
          $ref: '#/components/schemas/RecordIdValue'
          description: dcterms:identifier assigned by the DDB
        datasets:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uri-reference
          description: dcterms:isPartOf IRIs of all datasets containing the record
        provider:
          type: string
          format: uri-reference
          description: >-
            dcterms:publisher IRI of the providing organization, derived from its own DDB ID
        aggregator:
          type: string
          format: uri-reference
          description: edm:intermediateProvider IRI of the aggregating organization
        sourceIdentifier:
          $ref: '#/components/schemas/AdmsIdentifier'
        publicationStatus:
          type: string
          format: uri
          enum:
            - http://publications.europa.eu/resource/authority/dataset-status/DEVELOP
            - http://publications.europa.eu/resource/authority/dataset-status/COMPLETED
            - http://publications.europa.eu/resource/authority/dataset-status/WITHDRAWN
          description: adms:status using the EU Dataset Status controlled vocabulary
        invalidatedAtTime:
          type: [string, 'null']
          format: date-time
          description: >-
            prov:invalidatedAtTime of a tombstone. WITHDRAWN together with this value
            represents internal lifecycle state DELETED; WITHDRAWN without it is only
            a withdrawn record.
        deletionReason:
          type: string
          format: uri
          description: dcterms:type IRI from the controlled deletion-reason vocabulary
        deletionComment:
          type: string
          maxLength: 512
          description: Optional public dcterms:description of the deletion
        validationAssertion:
          $ref: '#/components/schemas/EarlValidationAssertion'
          description: Reverse earl:subject relationship to the record's validation assertion

    AdmsIdentifier:
      type: object
      additionalProperties: false
      required: ['@type', notation]
      properties:
        '@type':
          type: string
          const: adms:Identifier
        notation:
          type: string
          minLength: 1
          maxLength: 2048
          description: skos:notation containing the identifier assigned by the source system

    EarlValidationAssertion:
      type: object
      additionalProperties: false
      required: ['@id', '@type', test, mode, result]
      properties:
        '@id':
          type: string
          format: uri-reference
        '@type':
          type: string
          const: earl:Assertion
        test:
          type: string
          format: uri-reference
          description: earl:test IRI of the applied EDM profile
        mode:
          type: string
          const: earl:automatic
        result:
          $ref: '#/components/schemas/EarlTestResult'

    EarlTestResult:
      type: object
      additionalProperties: false
      required: ['@type', outcome]
      properties:
        '@type':
          type: string
          const: earl:TestResult
        outcome:
          type: string
          enum: [earl:passed, earl:failed, earl:untested]
          description: earl:outcome from the standard EARL outcome vocabulary
        info:
          type: string
          description: earl:info; present when a conforming record has validation warnings

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [detail]
            properties:
              detail:
                type: string
              pointer:
                type: string

  responses:
    BadRequest:
      description: Invalid request, parameter, or cursor
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Supplied credential is invalid, or a protected operation has none
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Client is authenticated but not authorized
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource is unknown or intentionally hidden
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: None of the requested response media types can be provided
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict with the current state or idempotency key
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match or If-None-Match does not match the current state
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match or If-None-Match is required for this write operation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Record deleted, or cursor or artifact expired or no longer available
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: Request content exceeds the byte limit
      headers:
        X-Request-Id:
