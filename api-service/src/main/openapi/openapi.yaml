  /3/records/{recordId}/source:
    get:
      tags: [Records]
      operationId: getRecordSource
      summary: Get the original source record
      description: >-
        Streams the exact source document stored for the current record state.
        It is not reconstructed from EDM and is not converted to another source
        schema. The Link response header identifies the public LIDO, EAD, METS, MODS,
        or other metadata format with rel="type" and, when applicable, a separate
        DDB/API application profile with rel="profile".
      security:
        - {}
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
        - $ref: '#/components/parameters/AcceptEncoding'
      responses:
        '200':
          description: Original source bytes in their stored XML media type
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Content-Encoding:
              $ref: '#/components/headers/ContentEncoding'
            Link:
              $ref: '#/components/headers/SourceLinks'
            X-Source-SHA256:
              $ref: '#/components/headers/SourceSha256'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/xml:
              schema:
                type: string
                format: binary
                description: UTF-8 XML, for example LIDO or EAD
            application/mets+xml:
              schema:
                type: string
                format: binary
                description: UTF-8 METS XML
            application/mods+xml:
              schema:
                type: string
                format: binary
                description: UTF-8 MODS XML
        '304':
          description: The stored source representation has not changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Vary:
              $ref: '#/components/headers/VaryAcceptEncoding'
            Link:
              $ref: '#/components/headers/SourceLinks'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Record or stored source representation not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
