openapi: 3.1.0
info:
  title: DDB API v3 - RDF Records
  version: 3.0.0-dev
  contact:
    name: Michael Büchner
    email: m.buechner@dnb.de
    url: https://github.com/mbuechner/ddb-api-v3
  description: >-
    Receives RDF in any serialization registered with Apache Jena, validates it
    immediately before storage, and converts it to uncompressed Jelly RDF in
    SeaweedFS through S3. Reads convert the stored dataset to the requested RDF
    serialization. Every input triple is stored in the single named graph
    {baseUrl}/records/{recordId}. The configured ddb.api.base-url (environment
    DDB_API_BASE_URL) defaults to https://api.deutsche-digitale-bibliothek.de.
    It is an HTTP(S) origin with an optional port and trailing slash, independent
    of request headers. Input graph names are replaced by this canonical graph
    name when writing; reads retain the stored graph name. Record methods
    use the exact object key {recordId}/record. Other document names are reserved
    for future API methods and are not selected through this API. No administrative
    metadata document or storage manifest is created. Requests support gzip content
    coding. Application-profile validation with SHACL is not implemented.
servers:
  - url: /

security:
  - oauth2: [records:write]

tags:
  - name: Records
    description: Validate, store and retrieve RDF datasets without an internal record model.

paths:
  /3/records/{recordId}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Retrieve an RDF record in the requested serialization
      description: >-
        Reads uncompressed Jelly RDF from {recordId}/record and converts the complete
        dataset with Apache Jena. Accept selects an installed RDF writer; without
        Accept, application/trig is used. The media types below are common examples,
        not an exhaustive list of registered Jena formats. Dataset formats retain
        the canonical named graph; graph formats such as RDF/XML and Turtle return
        all its triples without the graph name.
        The response ETag is weak because different serializations represent the same
        stored dataset. Use the strong X-Record-ETag value for a subsequent PUT If-Match.
      security:
        - oauth2: [records:read]
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Complete RDF dataset in the negotiated serialization
          headers:
            ETag:
              $ref: '#/components/headers/WeakETag'
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              description: Response selection depends on RDF and HTTP content negotiation
              schema:
                type: string
                example: Accept, Accept-Encoding
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            text/turtle:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/rdf+xml:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/n-triples:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/n-quads:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/trig:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            application/x-jelly-rdf:
              schema:
                $ref: '#/components/schemas/RdfDocument'
            '*/*':
              schema:
                $ref: '#/components/schemas/RdfDocument'
        '304':
          description: The stored dataset matches If-None-Match; response has no body
          headers:
            ETag:
              $ref: '#/components/headers/WeakETag'
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            Vary:
              description: Response selection depends on Accept and Accept-Encoding
              schema:
                type: string
                example: Accept, Accept-Encoding
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Records]
      operationId: createRecord
      summary: Validate and create an RDF record
      description: >-
        Parses the complete request body using its Content-Type with Apache Jena
        before any storage write. The dataset is converted to uncompressed Jelly
        RDF and stored directly under {recordId}/record. All input triples are merged
        into the named graph {baseUrl}/records/{recordId}, using the configured
        ddb.api.base-url (default: https://api.deutsche-digitale-bibliothek.de).
        Creation is conditional: an existing object is never overwritten and returns
        409. The successful response has no body; its ETag identifies the S3 object.
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        $ref: '#/components/requestBodies/RdfRecord'
      responses:
        '201':
          description: RDF record created
          headers:
            Location:
              description: API location of the record document
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Records]
      operationId: putRecord
      summary: Validate and replace an RDF record
      description: >-
        Parses the complete request body using its Content-Type with Apache Jena
        before any storage write. The dataset is converted to uncompressed Jelly
        RDF, with all triples merged into the named graph
        {baseUrl}/records/{recordId} using the configured ddb.api.base-url
        (default: https://api.deutsche-digitale-bibliothek.de), and replaces
        {recordId}/record only while
        If-Match matches its current S3 ETag. A missing If-Match returns 428.
        A stale, weak, invalid or unmatched validator returns 412; an unknown object
        also fails the write precondition. The successful response has no body.
        X-Record-ETag identifies the transformed Jelly object for later conditional
        replacements; PUT does not return ETag.
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/RdfRecord'
      responses:
        '204':
          description: RDF record replaced
          headers:
            X-Record-ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 Client Credentials authorization contract.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            records:read: Read RDF record datasets
            records:write: Create and replace RDF record documents

  parameters:
    RecordId:
      name: recordId
      in: path
      required: true
      description: Externally assigned 32-character DDB ID, RFC 4648 Base32 without padding
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: '^[A-Z2-7]{32}$'
      example: J6KQ3UBFBEMGAHGR6ZUAQCUXOBKQCFO3
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Required for replacement; omission returns 428. Supply a quoted current
        storage ETag from POST or the X-Record-ETag from GET/PUT, a comma-separated ETag list,
        or * by itself to require an existing
        object. Weak tags never match. A malformed header is rejected as a whole.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        Return 304 without a body if the current dataset matches an ETag in this
        list. Weak comparison is used; * matches any existing record.
      schema:
        type: string

  headers:
    ETag:
      description: Strong opaque validator of the stored Jelly object, including its HTTP quotation marks
      schema:
        type: string
    WeakETag:
      description: Weak dataset validator, for example W/"s3-object-tag"; cannot be used for PUT If-Match
      schema:
        type: string
    RequestId:
      description: Identifier for correlating the HTTP request with server logs
      schema:
        type: string

  requestBodies:
    RdfRecord:
      required: true
      description: >-
        Complete RDF document or dataset in a serialization registered with Apache
        Jena, identified by Content-Type. The media types below are common examples,
        not an exhaustive list. The complete decoded body is syntax-validated and
        converted to uncompressed Jelly before any storage write. All input triples
        are merged into the single named graph
        {baseUrl}/records/{recordId}, using the configured ddb.api.base-url
        (default: https://api.deutsche-digitale-bibliothek.de); original graph
        names and byte representation are not retained.
        JSON-LD contexts must be included inline; remote contexts are not loaded.
        The configurable upload-size limit applies after HTTP content decoding,
        including gzip decompression, and before RDF parsing.
      content:
        text/turtle:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/rdf+xml:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/ld+json:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/n-triples:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/n-quads:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/trig:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        application/x-jelly-rdf:
          schema:
            $ref: '#/components/schemas/RdfDocument'
        '*/*':
          schema:
            $ref: '#/components/schemas/RdfDocument'

  schemas:
    RdfDocument:
      type: string
      format: binary
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [detail]
            properties:
              detail:
                type: string
              pointer:
                type: string

  responses:
    BadRequest:
      description: Invalid request or DDB ID
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Request is not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: An RDF record already exists under this DDB ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No RDF record exists under this DDB ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotAcceptable:
      description: Accept does not allow an installed Apache Jena RDF writer, or the chosen format cannot represent this RDF dataset
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not identify the current existing RDF record
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Replacement requires an If-Match header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: Decoded RDF document exceeds the configured upload-size limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type does not identify an installed Apache Jena RDF parser
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Jena cannot parse the complete request body as valid RDF in its declared serialization
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Request rejected by the gateway rate limiter
    ServiceUnavailable:
      description: SeaweedFS S3 storage is unavailable or the stored object is not a valid Jelly dataset
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
