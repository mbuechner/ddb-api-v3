ddb:
  api:
    # Resolve public resource IRIs from each HTTP request unless an origin is pinned.
    base-url: ${DDB_API_BASE_URL:auto}
  storage:
    s3:
      # Public development credentials match the local SeaweedFS Compose service.
      access-key: ${DDB_API_S3_ACCESS_KEY:ddb-dev}
      secret-key: ${DDB_API_S3_SECRET_KEY:ddb-dev-secret}
      create-bucket: ${DDB_API_S3_CREATE_BUCKET:true}
