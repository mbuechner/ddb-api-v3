server:
  port: ${SERVER_PORT:8080}
  # Enable native forwarding only behind a proxy that sanitizes incoming forwarding headers.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  compression:
    # Jetty handles negotiation, gzip request decompression, response compression and
    # encoding-specific ETags. Small responses stay uncompressed by default.
    enabled: ${DDB_API_COMPRESSION_ENABLED:true}
    min-response-size: ${DDB_API_COMPRESSION_MIN_RESPONSE_SIZE:1KB}
    additional-mime-types:
      - application/problem+json
      - application/rdf+xml
      - application/ld+json
      - application/x-jelly-rdf

spring:
  config:
    # Support one shared developer .env both from the repository root (IDE/JAR) and from
    # the module directory (Maven). OS/container environment variables retain higher priority.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: ddb-api-v3-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:}
          audiences: ${OAUTH2_AUDIENCE:}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}
  main:
    banner-mode: "off"
  profiles:
    active: ${APP_PROFILE:dev}
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,s3Storage
          show-details: always

logging:
  level:
    de.ddb.apiv3.access: ${LOGGING_LEVEL_DE_DDB_APIV3_ACCESS:INFO}
  structured:
    format:
      # Spring Boot escapes and writes one ECS JSON object per console event.
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

ddb:
  security:
    # Empty means write access stays locked. Production accepts only verified JWTs.
    dev-write-token: ${DDB_DEV_WRITE_TOKEN:}
  logging:
    access:
      enabled: ${DDB_ACCESS_LOG_ENABLED:true}
      client-id-header-name: ${CLIENT_ID_HEADER_NAME:X-Client-Id}
  api:
    # Canonical production origin; dev defaults to request-based auto mode.
    base-url: ${DDB_API_BASE_URL:https://api.deutsche-digitale-bibliothek.de}
    # Applied to the decompressed RDF body before validation and storage.
    max-document-size: ${DDB_API_UPLOAD_MAX_FILE_SIZE:1MB}
    concurrency:
      # Bound active RDF work and waiting requests; health/documentation bypass this gate.
      max-requests: ${DDB_API_MAX_CONCURRENT_REQUESTS:32}
      max-queued-requests: ${DDB_API_MAX_QUEUED_REQUESTS:64}
      queue-timeout: ${DDB_API_QUEUE_TIMEOUT:1s}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://127.0.0.1:8333}
      region: ${S3_REGION:eu-central-1}
      bucket: ${S3_BUCKET:ddb-records}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      connection-timeout: ${S3_CONNECTION_TIMEOUT:2s}
      read-timeout: ${S3_READ_TIMEOUT:10s}
      max-connections: ${S3_MAX_CONNECTIONS:50}
      create-bucket: ${S3_CREATE_BUCKET:false}
