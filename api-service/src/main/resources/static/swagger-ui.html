<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DDB API v3</title>
    <!-- The WebJars locator resolves these stable paths to the version pinned in pom.xml. -->
    <link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
<script src="/webjars/swagger-ui/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = function () {
        const ui = SwaggerUIBundle({
            url: "/openapi/openapi.yaml",
            dom_id: "#swagger-ui",
            deepLinking: true,
            // Keep Try-it-out on this server; the published contract names the public API.
            onComplete: function () {
                const spec = ui.specSelectors.specJS();
                ui.specActions.updateJsonSpec({
                    ...spec,
                    servers: [{url: window.location.origin, description: "Current server"}]
                });
                ui.oas3Actions.setSelectedServer(window.location.origin);
            },
            // Try-it-out must fetch the selected format, even after an earlier cached response.
            requestInterceptor: function (request) {
                request.cache = "no-store";
                return request;
            },
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "StandaloneLayout"
        });
    };
</script>
</body>
</html>
