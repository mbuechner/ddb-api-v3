{{- range $role, $component := dict "apiService" "api-service" "gateway" "gateway" }}
{{- $settings := index $.Values $role }}
{{- $api := eq $role "apiService" }}
{{- $single := eq (int (ternary $settings.autoscaling.minReplicas $settings.replicaCount $settings.autoscaling.enabled)) 1 }}
{{- $name := include (ternary "ddb-api-v3.apiServiceName" "ddb-api-v3.gatewayName" $api) $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ddb-api-v3.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minReadySeconds: 5
  {{- if not $settings.autoscaling.enabled }}
  replicas: {{ $settings.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A single replica is replaced without reserving capacity for a second pod.
      maxUnavailable: {{ ternary 1 0 $single }}
      maxSurge: {{ ternary 0 1 $single }}
  selector:
    matchLabels:
      {{- include "ddb-api-v3.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ddb-api-v3.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- if not $api }}
        ddb-api-v3/redis-client: "true"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with $.Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $component }}
          image: "{{ (index $.Values.images $role).repository }}:{{ (index $.Values.images $role).tag }}"
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: {{ include "ddb-api-v3.configMapName" $ }}
          env:
            - name: {{ ternary "DDB_API_PORT" "GATEWAY_PORT" $api }}
              value: {{ ternary "8080" "8081" $api | quote }}
            - name: {{ ternary "DDB_API_FORWARD_HEADERS_STRATEGY" "GATEWAY_FORWARD_HEADERS_STRATEGY" $api }}
              value: {{ $settings.forwardHeadersStrategy | quote }}
            {{- if $.Values.auth.devWriteTokenSecret }}
            - name: DDB_DEV_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.auth.devWriteTokenSecret | quote }}
                  key: DDB_DEV_WRITE_TOKEN
            {{- end }}
            {{- if $api }}
            - name: DDB_API_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddb-api-v3.s3SecretName" $ }}
                  key: {{ $.Values.s3.secretKeys.accessKey | quote }}
            - name: DDB_API_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddb-api-v3.s3SecretName" $ }}
                  key: {{ $.Values.s3.secretKeys.secretKey | quote }}
            {{- else }}
            - name: GATEWAY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddb-api-v3.redisSecretName" $ }}
                  key: REDIS_PASSWORD
            {{- if $.Values.redis.haMode.enabled }}
            - name: SPRING_DATA_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ddb-api-v3.redisSecretName" $ }}
                  key: REDIS_SENTINEL_PASSWORD
            {{- end }}
            {{- end }}
            {{- range $name, $value := $settings.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ ternary 8080 8081 $api }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                # Let endpoint removal reach proxies before Java's graceful drain.
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ $settings.initialDelaySeconds }}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ index ($settings.resources.limits | default dict) "ephemeral-storage" | default "64Mi" | quote }}
      {{- with $.Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.pod.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
