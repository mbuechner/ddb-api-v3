apiVersion: v1
kind: Service
metadata:
  name: {{ include "ddb-api-v3.gatewayName" . }}
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ddb-api-v3.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway

