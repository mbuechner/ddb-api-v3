{{- range $role, $component := dict "apiService" "api-service" "gateway" "gateway" }}
{{- $settings := index $.Values $role }}
{{- if $settings.autoscaling.enabled }}
{{- if gt (int $settings.autoscaling.minReplicas) (int $settings.autoscaling.maxReplicas) }}
{{- fail (printf "%s.autoscaling.maxReplicas must be greater than or equal to minReplicas" $role) }}
{{- end }}
{{- $name := include (ternary "ddb-api-v3.apiServiceName" "ddb-api-v3.gatewayName" (eq $role "apiService")) $ }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "ddb-api-v3.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $settings.autoscaling.minReplicas }}
  maxReplicas: {{ $settings.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $settings.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

