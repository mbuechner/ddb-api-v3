{{- $cassandraName := include "ddb-api-v3.cassandraSecretName" . -}}
{{- $existingCassandra := lookup "v1" "Secret" .Release.Namespace $cassandraName -}}
{{- $cassandraUsername := "" -}}
{{- $cassandraPassword := "" -}}
{{- if and $existingCassandra (hasKey $existingCassandra.data "CASSANDRA_USERNAME") -}}
{{- $cassandraUsername = index $existingCassandra.data "CASSANDRA_USERNAME" -}}
{{- else -}}
{{- $cassandraUsername = required "cassandra.username is required" .Values.cassandra.username | b64enc -}}
{{- end -}}
{{- if and $existingCassandra (hasKey $existingCassandra.data "CASSANDRA_PASSWORD") -}}
{{- $cassandraPassword = index $existingCassandra.data "CASSANDRA_PASSWORD" -}}
{{- else -}}
{{- $cassandraPassword = required "cassandra.password is required" .Values.cassandra.password | b64enc -}}
{{- end -}}
{{- $redisName := include "ddb-api-v3.redisSecretName" . -}}
{{- $existingRedis := lookup "v1" "Secret" .Release.Namespace $redisName -}}
{{- $redisPassword := randAlphaNum 48 -}}
{{- if and $existingRedis (hasKey $existingRedis.data "REDIS_PASSWORD") -}}
{{- $redisPassword = index $existingRedis.data "REDIS_PASSWORD" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cassandraName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  CASSANDRA_USERNAME: {{ $cassandraUsername | quote }}
  CASSANDRA_PASSWORD: {{ $cassandraPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_USERNAME: {{ .Values.redis.auth.username | b64enc | quote }}
  REDIS_PASSWORD: {{ $redisPassword | b64enc | quote }}
  REDIS_SENTINEL_PASSWORD: {{ $redisPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddb-api-v3.redisServerConfigSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  authentication.conf: {{ printf "user default off\nuser replication on >%s resetkeys resetchannels &__sentinel__:hello -@all +ping +psync +replconf +client +subscribe +publish +multi +exec +slaveof +config|rewrite +role +info +script|kill\nuser %s on >%s allkeys allchannels +@all\nmasteruser replication\nmasterauth %s\n" $redisPassword .Values.redis.auth.username $redisPassword $redisPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddb-api-v3.redisSentinelConfigSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  authentication.conf: {{ printf "requirepass %s\nsentinel sentinel-pass %s\nsentinel auth-user %s replication\nsentinel auth-pass %s %s\n" $redisPassword $redisPassword .Values.redis.haMode.masterGroupName .Values.redis.haMode.masterGroupName $redisPassword | b64enc | quote }}
