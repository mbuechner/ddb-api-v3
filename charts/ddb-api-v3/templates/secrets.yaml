{{- $redisName := include "ddb-api-v3.redisSecretName" . -}}
{{- $existingRedis := lookup "v1" "Secret" .Release.Namespace $redisName -}}
{{- $passwords := dict -}}
{{- range $key := list "REDIS_PASSWORD" "REDIS_REPLICATION_PASSWORD" "REDIS_SENTINEL_PASSWORD" "REDIS_SENTINEL_PEER_PASSWORD" -}}
{{- $password := randAlphaNum 48 -}}
{{- if $existingRedis -}}
{{- $password = required (printf "%s must contain %s" $redisName $key) (index $existingRedis.data $key) | b64dec -}}
{{- end -}}
{{- $_ := set $passwords $key $password -}}
{{- end -}}
{{- if ne (len (values $passwords | uniq)) 4 -}}
{{- fail "Redis role credentials must be distinct" -}}
{{- end -}}
{{- $redisPassword := index $passwords "REDIS_PASSWORD" -}}
{{- $replicationPassword := index $passwords "REDIS_REPLICATION_PASSWORD" -}}
{{- $sentinelPassword := index $passwords "REDIS_SENTINEL_PASSWORD" -}}
{{- $peerPassword := index $passwords "REDIS_SENTINEL_PEER_PASSWORD" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  REDIS_USERNAME: {{ .Values.redis.auth.username | b64enc | quote }}
  {{- range $key, $password := $passwords }}
  {{ $key }}: {{ $password | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddb-api-v3.redisServerConfigSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  authentication.conf: {{ printf "user default off\nuser replication on >%s resetkeys resetchannels &__sentinel__:hello -@all +ping +psync +replconf +client +subscribe +publish +multi +exec +slaveof +config|rewrite +role +info +script|kill\nuser %s on >%s allkeys resetchannels +@all -@dangerous +info\nmasteruser replication\nmasterauth %s\n" $replicationPassword .Values.redis.auth.username $redisPassword $replicationPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ddb-api-v3.redisSentinelConfigSecretName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ddb-api-v3.labels" . | nindent 4 }}
type: Opaque
data:
  authentication.conf: {{ printf "user default off\nuser sentinel-admin on >%s allchannels +@all\nuser %s on >%s -@all +auth +client|getname +client|id +client|setname +client|setinfo +command +hello +ping +role +info +sentinel|get-master-addr-by-name +sentinel|master +sentinel|myid +sentinel|replicas +sentinel|sentinels +sentinel|masters\nsentinel sentinel-user sentinel-admin\nsentinel sentinel-pass %s\nsentinel auth-user %s replication\nsentinel auth-pass %s %s\n" $peerPassword .Values.redis.auth.username $sentinelPassword $peerPassword .Values.redis.haMode.masterGroupName .Values.redis.haMode.masterGroupName $replicationPassword | b64enc | quote }}
