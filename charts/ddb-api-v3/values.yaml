# Image locations, S3 storage and the public endpoint are the only values that
# normally need adapting. Application defaults live in the chart templates;
# extraEnv remains available for exceptional Spring configuration overrides.
# Every resources block reserves requests and caps usage with limits;
# each request must be <= its limit. Quantities such as whole CPU cores are strings.
appProfile: prod

images:
  apiService:
    repository: ghcr.io/mbuechner/ddb-api-v3-service
    tag: "latest"
  gateway:
    repository: ghcr.io/mbuechner/ddb-api-v3-gateway
    tag: "latest"
  # Pods always resolve the configured tag through the registry. Images are
  # never embedded in this Helm chart.
  pullPolicy: Always
  pullSecrets: []

# Both applications write ECS JSON to stdout. Collect centrally with the cluster log agent.
logging:
  accessEnabled: true

# External OAuth2/OIDC issuer. All empty keeps writes locked; GET remains public.
# No development bearer token is accepted by the production profile.
auth:
  issuerUri: ""
  audience: ""
  # Optional override; otherwise Spring discovers the issuer's public-key endpoint.
  jwkSetUri: ""
  # Only with appProfile=dev and empty JWT settings. Secret key: DDB_DEV_WRITE_TOKEN.
  devWriteTokenSecret: ""

s3:
  endpoint: https://s3.example.internal
  region: eu-central-1
  bucket: ddb-records
  pathStyleAccess: true
  connectionTimeout: 2s
  readTimeout: 10s
  maxConnections: 8
  # Production buckets are provisioned by the storage operator.
  createBucket: false
  # Operator-managed credential Secret; secretKeys maps its keys to the API's S3_* ENV.
  existingSecret: ddb-api-v3-s3
  secretKeys:
    accessKey: S3_ACCESS_KEY
    secretKey: S3_SECRET_KEY

ingress:
  enabled: true
  # Empty selects the OpenShift or Kubernetes cluster's default IngressClass.
  className: ""
  host: api.example.org
  annotations: {}
  # Empty selects the ingress controller's default TLS certificate.
  tlsSecretName: ""

apiService:
  # Enable forwarding only behind a proxy that sanitizes incoming forwarded headers.
  forwardHeadersStrategy: none
  # Canonical origin for RDF graph names, independent of ingress.host.
  baseUrl: https://api.deutsche-digitale-bibliothek.de
  maxDocumentSize: 1MB
  replicaCount: 1
  # Wait before the first startup check; liveness/readiness follow startup success.
  initialDelaySeconds: 60
  # Bound work and the queue per pod; increase only with measured CPU/heap headroom.
  concurrency:
    maxRequests: 4
    maxQueuedRequests: 8
    queueTimeout: 1s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 64Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Requires a VPA controller; recommendations only, no automatic changes.
  vpa:
    enabled: false
  extraEnv: {}

gateway:
  forwardHeadersStrategy: none
  replicaCount: 1
  initialDelaySeconds: 60
  # Shared upstream pool per gateway pod, not per downstream API pod.
  maxConnections: 32
  rateLimit:
    capacity: 20
    refillTokens: 10
    refillPeriod: 1s
    requestedTokens: 1
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
      ephemeral-storage: 64Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  vpa:
    enabled: false
  extraEnv: {}

redis:
  # false: StatefulSet with stable pod/PVC names. true: standalone Deployment
  # with one pod, Recreate rollouts and its own PVC. HA always uses a StatefulSet.
  useDeploymentWhenNonHA: false
  # Groundhog2k deploys the unmodified Docker Official Redis image. The
  # dependency archive contains only Helm templates, never this image.
  image:
    registry: docker.io
    repository: library/redis
    tag: "8-alpine"
    pullPolicy: Always
  auth:
    username: gateway
    secretName: ddb-api-v3-redis-auth
  serviceAccount:
    # The parent chart already creates this account with token automount disabled.
    # Keep the subchart's additional creation off to avoid duplicate resources.
    create: false
    name: ddb-api-v3-redis
  podLabels:
    ddb-api-v3/redis-node: "true"
  # Disable the subchart's fixed UID/GID 999. OpenShift's restricted SCC
  # supplies the permitted UID, GID, fsGroup and container restrictions.
  podSecurityContext: false
  securityContext: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  sentinelResources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  vpa:
    enabled: false
  metrics:
    enabled: false
    exporter:
      image:
        pullPolicy: Always
  initResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  redisConfig: |-
    appendonly yes
    appendfsync everysec
    save ""
    maxmemory 32mb
    maxmemory-policy noeviction
  extraSecretRedisConfigs: ddb-api-v3-redis-server-config
  extraSecretSentinelConfigs: ddb-api-v3-redis-sentinel-config
  customStartupProbe: &redisProbe
    exec:
      command:
        - sh
        - -c
        - |-
          # Probe this container's own Redis or Sentinel process.
          if grep -q sentinel /proc/1/cmdline; then
            password="$(awk '/^sentinel sentinel-pass / {print $3; exit}' /data/conf/sentinel.conf)"
            REDISCLI_AUTH="$password" redis-cli --user sentinel-admin -p 26379 ping
          else
            password="$(awk '/^masterauth / {print $2; exit}' /data/conf/redis.conf)"
            REDISCLI_AUTH="$password" redis-cli --user replication -p 6379 ping
          fi | grep -q PONG
    periodSeconds: 5
    failureThreshold: 30
  customLivenessProbe:
    <<: *redisProbe
    periodSeconds: 10
    failureThreshold: 3
  customReadinessProbe:
    <<: *redisProbe
    periodSeconds: 5
    failureThreshold: 3
  haMode:
    enabled: false
    masterGroupName: ddb-api-v3
    replicas: 3
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 60000
    parallelSyncs: 1
    failoverWait: 10
  storage:
    requestedSize: 1Gi
    className: ""
    # Retain the standalone Deployment's PVC after helm uninstall.
    keepPvc: true
    persistentVolumeClaimRetentionPolicy:
      whenScaled: Retain
      whenDeleted: Retain
  podDisruptionBudget:
    # Configure only maxUnavailable; Kubernetes forbids minAvailable alongside it.
    maxUnavailable: 1
  affinity: {}
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                ddb-api-v3/redis-node: "true"
          - podSelector:
              matchLabels:
                ddb-api-v3/redis-client: "true"
        ports:
          - { protocol: TCP, port: 6379 }
          - { protocol: TCP, port: 26379 }

# Scheduling overrides for the API and gateway pods.
pod:
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

nameOverride: ""
fullnameOverride: ""
