name: ddb-api-v3

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: ${DDB_API_S3_ACCESS_KEY:-ddb-dev}
      AWS_SECRET_ACCESS_KEY: ${DDB_API_S3_SECRET_KEY:-ddb-dev-secret}
      S3_BUCKET: ${DDB_API_S3_BUCKET:-ddb-records}
    ports:
      - "127.0.0.1:${DDB_API_S3_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The image ships curl. S3's anonymous root may return 403; the API checks bucket access.
      test: ["CMD-SHELL", "curl -fsS --max-time 1 http://127.0.0.1:8888/ >/dev/null && curl -sS --max-time 1 http://127.0.0.1:8333/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  api-service:
    build:
      context: ./api-service
    environment:
      # One deployment profile is valid for both applications.
      APP_PROFILE: dev
      DDB_API_PORT: ${DDB_API_PORT:-8080}
      DDB_DEV_WRITE_TOKEN: ${DDB_DEV_WRITE_TOKEN:-}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
      OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-}
      DDB_API_FORWARD_HEADERS_STRATEGY: ${DDB_API_FORWARD_HEADERS_STRATEGY:-none}
      DDB_API_FORWARD_HEADERS_NAMING: ${DDB_API_FORWARD_HEADERS_NAMING:-rfc-7239}
      DDB_API_LOG_FORMAT: ${DDB_API_LOG_FORMAT:-ecs}
      DDB_API_ACCESS_LOG_ENABLED: ${DDB_API_ACCESS_LOG_ENABLED:-true}
      DDB_API_ACCESS_LOG_LEVEL: ${DDB_API_ACCESS_LOG_LEVEL:-INFO}
      DDB_API_PERFORMANCE_LOG_ENABLED: ${DDB_API_PERFORMANCE_LOG_ENABLED:-true}
      DDB_API_SLOW_REQUEST_THRESHOLD: ${DDB_API_SLOW_REQUEST_THRESHOLD:-100ms}
      DDB_API_CLIENT_ID_HEADER_NAME: ${DDB_API_CLIENT_ID_HEADER_NAME:-X-Client-Id}
      DDB_API_BASE_URL: ${DDB_API_BASE_URL:-https://api.deutsche-digitale-bibliothek.de}
      DDB_API_UPLOAD_MAX_FILE_SIZE: ${DDB_API_UPLOAD_MAX_FILE_SIZE:-1MB}
      DDB_API_COMPRESSION_ENABLED: ${DDB_API_COMPRESSION_ENABLED:-true}
      DDB_API_COMPRESSION_MIN_RESPONSE_SIZE: ${DDB_API_COMPRESSION_MIN_RESPONSE_SIZE:-1KB}
      DDB_API_MAX_CONCURRENT_REQUESTS: ${DDB_API_MAX_CONCURRENT_REQUESTS:-32}
      DDB_API_MAX_QUEUED_REQUESTS: ${DDB_API_MAX_QUEUED_REQUESTS:-64}
      DDB_API_QUEUE_TIMEOUT: ${DDB_API_QUEUE_TIMEOUT:-1s}
      DDB_API_S3_ENDPOINT: http://seaweedfs:8333
      DDB_API_S3_REGION: ${DDB_API_S3_REGION:-eu-central-1}
      DDB_API_S3_BUCKET: ${DDB_API_S3_BUCKET:-ddb-records}
      DDB_API_S3_ACCESS_KEY: ${DDB_API_S3_ACCESS_KEY:-ddb-dev}
      DDB_API_S3_SECRET_KEY: ${DDB_API_S3_SECRET_KEY:-ddb-dev-secret}
      DDB_API_S3_PATH_STYLE_ACCESS: ${DDB_API_S3_PATH_STYLE_ACCESS:-true}
      DDB_API_S3_CONNECTION_TIMEOUT: ${DDB_API_S3_CONNECTION_TIMEOUT:-2s}
      DDB_API_S3_READ_TIMEOUT: ${DDB_API_S3_READ_TIMEOUT:-10s}
      DDB_API_S3_MAX_CONNECTIONS: ${DDB_API_S3_MAX_CONNECTIONS:-50}
      DDB_API_S3_CREATE_BUCKET: ${DDB_API_S3_CREATE_BUCKET:-true}
    expose:
      - "${DDB_API_PORT:-8080}"
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      APP_PROFILE: dev
      DDB_DEV_WRITE_TOKEN: ${DDB_DEV_WRITE_TOKEN:-}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
      OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-}
      GATEWAY_PORT: ${GATEWAY_PORT:-8081}
      GATEWAY_FORWARD_HEADERS_STRATEGY: ${GATEWAY_FORWARD_HEADERS_STRATEGY:-none}
      GATEWAY_FORWARD_HEADERS_NAMING: ${GATEWAY_FORWARD_HEADERS_NAMING:-rfc-7239}
      GATEWAY_LOG_FORMAT: ${GATEWAY_LOG_FORMAT:-ecs}
      GATEWAY_ACCESS_LOG_ENABLED: ${GATEWAY_ACCESS_LOG_ENABLED:-true}
      GATEWAY_ACCESS_LOG_LEVEL: ${GATEWAY_ACCESS_LOG_LEVEL:-INFO}
      GATEWAY_PERFORMANCE_LOG_ENABLED: ${GATEWAY_PERFORMANCE_LOG_ENABLED:-true}
      GATEWAY_SLOW_REQUEST_THRESHOLD: ${GATEWAY_SLOW_REQUEST_THRESHOLD:-100ms}
      GATEWAY_HTTP_MAX_CONNECTIONS: ${GATEWAY_HTTP_MAX_CONNECTIONS:-256}
      GATEWAY_API_SERVICE_URI: http://api-service:${DDB_API_PORT:-8080}
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-10}
      GATEWAY_RATE_LIMIT_REFILL_PERIOD: ${GATEWAY_RATE_LIMIT_REFILL_PERIOD:-1s}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-20}
      GATEWAY_RATE_LIMIT_REQUESTED_TOKENS: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:-1}
      GATEWAY_CLIENT_ID_HEADER_ENABLED: ${GATEWAY_CLIENT_ID_HEADER_ENABLED:-true}
      GATEWAY_CLIENT_ID_HEADER_NAME: ${GATEWAY_CLIENT_ID_HEADER_NAME:-X-Client-Id}
      GATEWAY_ANONYMOUS_RATE_LIMIT_BY_REMOTE_ADDRESS: ${GATEWAY_ANONYMOUS_RATE_LIMIT_BY_REMOTE_ADDRESS:-true}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8081}:${GATEWAY_PORT:-8081}"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      api-service:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  seaweedfs-data:
